{% if can('ai.use') %}
<button type="button" id="chat-fab" class="chat-fab" aria-controls="chat-panel" aria-expanded="false" aria-label="{{ t('Ask the assistant') }}" title="{{ t('Ask the assistant') }}"><img src="/static/retailos-mark.svg?v={{ asset_v('retailos-mark.svg') }}" class="chat-brand-mark" width="32" height="32" alt=""><span>{{ t('Ask AI') }}</span></button>
<section id="chat-panel" class="chat-panel" data-user="{{ user.id }}" hidden aria-label="{{ t('Assistant chat') }}">
  <header><div class="chat-t"><img src="/static/retailos-mark.svg?v={{ asset_v('retailos-mark.svg') }}" class="chat-brand-mark" width="32" height="32" alt=""><div><b>Retail OS <span class="chat-ai-label">AI</span></b><div class="small">{{ t('Your stores. Your data.') }}</div></div></div>
    <div><button type="button" id="chat-history" class="iconbtn sm" title="{{ t('Saved conversations') }}" aria-label="{{ t('Saved conversations') }}"><svg class="i"><use href="#i-list"/></svg></button><a href="/assistant" class="iconbtn sm chat-expand" title="{{ t('Open Assistant workspace') }}" aria-label="{{ t('Open Assistant workspace') }}">&#8599;</a><button type="button" id="chat-clear" class="iconbtn sm" title="{{ t('Start over') }}" aria-label="{{ t('Start over') }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" id="chat-close" class="iconbtn sm" title="{{ t('Close') }}" aria-label="{{ t('Close') }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></header>
  <div class="chat-scope"><label><input id="chat-use-context" type="checkbox" checked>{{ t('Use page context') }}</label><div id="chat-context" aria-live="polite">{{ t('Your accessible stores') }}</div></div>
  <div id="chat-history-list" class="chat-history-list" hidden></div>
  <div id="chat-log" class="chat-log" aria-live="polite"></div>
  <div class="chat-sugg" id="chat-sugg">
    <button type="button" class="chip" data-chat-ask="{{ t('What should I deal with first today?') }}">{{ t('What first today?') }}</button>
    <button type="button" class="chip" data-chat-ask="{{ t('Which items are most likely to run out this week?') }}">{{ t('Likely to run out') }}</button>
    <button type="button" class="chip" data-chat-ask="{{ t('Which purchase orders should we chase?') }}">{{ t('POs to chase') }}</button>
    <button type="button" class="chip" data-chat-ask="{{ t('How are the stores doing compared with their usual sales?') }}">{{ t('Store sales vs usual') }}</button>
  </div>
  <form novalidate id="chat-form" class="chat-form" autocomplete="off"><input type="hidden" id="chat-csrf" value="{{ csrf }}">
    <textarea id="chat-input" name="question" rows="2" placeholder="{{ t('Ask about stock, sales, orders...') }}" maxlength="600" aria-label="{{ t('Your question') }}"></textarea><button type="button" id="chat-stop" class="sec" hidden>{{ t('Stop') }}</button><button id="chat-send" class="ai" title="{{ t('Send') }}" aria-label="{{ t('Send') }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></form>
  <div class="chat-foot">{{ t('It can only suggest actions. You decide.') }}</div>
</section>
{% endif %}
